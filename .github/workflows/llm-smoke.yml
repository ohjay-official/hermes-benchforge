name: model smoke test

# The whole /bench loop against a real model (Gemini): write the checks, write the sketch, fix until green.
# Run it by hand from the Actions tab; it uses the GEMINI_API_KEY repository secret.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model"
        default: "gemini-2.5-flash"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BENCHFORGE_HOME: ${{ github.workspace }}/.benchforge-ci
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: python -m benchforge setup
      - name: Three requests, end to end
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: python tools/llm_smoke.py "$MODEL"
