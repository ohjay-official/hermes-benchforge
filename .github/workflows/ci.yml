name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BENCHFORGE_HOME: ${{ github.workspace }}/.benchforge-ci
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Rosetta (Arduino's AVR compiler for macOS is an Intel program)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Unit tests (no compiler needed)
        run: python -m unittest discover -s tests -t . -v

      - name: Install the pinned Arduino compiler, the same way a user does
        run: python -m benchforge setup

      - name: Golden benches on the real arduino-cli and AVR core
        run: python tools/golden.py

      - name: Demo
        run: python -m benchforge demo

      - name: A receipt reproduces exactly
        run: |
          python -m benchforge run examples/greenhouse-fan/bench.json examples/greenhouse-fan/fixed.ino --json > receipt.json
          python -m benchforge verify receipt.json examples/greenhouse-fan/fixed.ino

      - name: The live-link dictionary is exactly the golden benches' results and firmware
        if: runner.os == 'Linux'
        run: |
          if ! python tools/make_live_dict.py --check; then
            python tools/make_live_dict.py
            f="web/dicts/$(cat web/dicts/current.txt).txt"
            echo "----- fresh $f -----"; cat "$f"; echo "----- end -----"
            exit 1
          fi

  hermes:
    name: hermes plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Hermes Agent (latest stable)
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: hermes plugins validate (the catalog's own admission check)
        run: hermes plugins validate . --install-deps
      - name: hermes plugins doctor
        run: hermes plugins doctor . --ci
      - name: Install into a real Hermes and run it there
        run: |
          mkdir -p "$HOME/.hermes/plugins/benchforge"
          git archive HEAD | tar -x -C "$HOME/.hermes/plugins/benchforge"
          hermes plugins enable benchforge
          hermes bench setup
          hermes bench demo
