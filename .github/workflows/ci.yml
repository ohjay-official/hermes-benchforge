name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      BENCHFORGE_HOME: ${{ github.workspace }}/.benchforge-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Rosetta (Arduino's AVR compiler for macOS is an Intel program)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Unit tests (no compiler needed)
        run: python -m unittest discover -s tests -t . -v

      - name: Install the pinned Arduino compiler, the same way a user does
        run: python -m benchforge setup

      - name: Golden benches on the real arduino-cli and AVR core
        run: python tools/golden.py

      - name: Demo
        run: python -m benchforge demo

      - name: A receipt reproduces exactly
        run: |
          python -m benchforge run examples/greenhouse-fan/bench.json examples/greenhouse-fan/fixed.ino --json > receipt.json
          python -m benchforge verify receipt.json examples/greenhouse-fan/fixed.ino

  hermes:
    name: hermes plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Hermes Agent (latest stable)
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: hermes plugins validate (the catalog's own admission check)
        run: hermes plugins validate . --install-deps
      - name: hermes plugins doctor
        run: hermes plugins doctor . --ci
